<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<meta name="color-scheme" content="dark">
<!-- 検索エンジンへの掲載とリンク追跡を拒否する -->
<meta name="robots" content="noindex, nofollow">
<title>シーン下書き</title>
<style>
  /* ===== デザイントークン：夜間閲覧向け =====
     ・青成分を抑えた暖色寄りの暗色（ブルーライトと眩しさを軽減）
     ・純白を避け、背景とのコントラストを約9:1に抑える（読みやすさは維持しつつ光のにじみを軽減）
     ・大きな面を明るい色で塗らない（ボタン・通知も暗色ベース） */
  :root {
    color-scheme: dark;       /* スクロールバー等のネイティブ部品も暗色に */
    --bg: #1C2233;            /* 背景：藍墨 */
    --surface: #252C41;       /* 操作バー・通知の面 */
    --line: #343C55;          /* 区切り線 */
    --text: #DCD7CA;          /* 本文：生成り（初版より少しだけ輝度を下げた） */
    --muted: #8E93A6;         /* 補助テキスト */
    --placeholder: #5D6378;   /* 入力例 */
    --narr: #8FB0D3;          /* 地の文の識別色 */
    --dial: #E3B75E;          /* セリフの識別色 */
    --prem: #B3A6CF;          /* 前提の識別色（地の文・セリフと区別できる淡い紫） */
    --narr-tint: rgba(143, 176, 211, .14); /* 地の文 選択時の淡い面 */
    --dial-tint: rgba(227, 183, 94, .14);  /* セリフ 選択時の淡い面 */
    --prem-tint: rgba(179, 166, 207, .14); /* 前提 選択時の淡い面 */
    /* 暗色背景では明朝体の細い横画がにじみやすいため、ゴシック体を採用 */
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body {
    padding: 16px 14px calc(100px + env(safe-area-inset-bottom)); /* 下部固定バー＋ホームバー分の余白 */
    font-weight: 400;                     /* 暗色背景では明るい文字が太く見えるため、太字を使わない */
    -webkit-font-smoothing: antialiased;  /* 明るい文字の膨張を抑える（macOS/iOS） */
  }
  main { max-width: 680px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 1rem; font-weight: 500; color: var(--muted); margin: 0; letter-spacing: .1em; }
  #stat { color: var(--muted); font-size: .85rem; }

  /* 前置き（コピー時に先頭へ付ける指示文）は折りたたみ */
  details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  summary { color: var(--muted); font-size: .9rem; cursor: pointer; }

  /* 入力欄共通：iOSの自動ズーム回避のため16px以上。本文は18px */
  textarea, input[type="text"] {
    background: transparent; color: var(--text); border: 0; outline: none;
    font-family: var(--sans); font-weight: 400; letter-spacing: .03em; caret-color: var(--dial);
  }
  textarea {
    width: 100%; resize: none; overflow: hidden; min-height: 2.8em; padding: 4px 2px;
    font-size: 1.125rem; line-height: 1.85;
  }
  textarea::placeholder, input::placeholder { color: var(--placeholder); }

  /* ===== 行リスト ===== */
  ol { list-style: none; margin: 0; padding: 0; }
  .row { border-bottom: 1px solid var(--line); padding: 10px 0 8px; }
  .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }

  /* 種類切替：ラジオは視覚的に隠すがフォーカス可能なまま残す */
  .toggle { display: flex; gap: 6px; border: 0; margin: 0; padding: 0; }
  .toggle legend, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle span {
    display: inline-block; min-width: 4.4em; text-align: center; padding: 6px 10px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .9rem;
  }
  /* 選択中は塗りつぶさず、枠線＋淡い面で示す（眩しさ対策） */
  .toggle input[value="narration"]:checked + span { border-color: var(--narr); color: var(--narr); background: var(--narr-tint); }
  .toggle input[value="dialogue"]:checked + span { border-color: var(--dial); color: var(--dial); background: var(--dial-tint); }
  .toggle input[value="premise"]:checked + span { border-color: var(--prem); color: var(--prem); background: var(--prem-tint); }
  .toggle input:focus-visible + span, button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }

  .del { background: none; border: 0; color: var(--muted); font-size: 1.3rem; width: 40px; height: 36px; cursor: pointer; }

  /* ===== 本文エリア：[名前][「文章」] の横並び ===== */
  .body { display: flex; align-items: flex-start; gap: 6px; }
  .text { position: relative; flex: 1; min-width: 0; }

  /* 名前欄：セリフ行のみ表示 */
  .speaker { display: none; }
  .row[data-type="dialogue"] .speaker {
    display: block; flex: 0 0 5.5em; width: 5.5em; padding: 4px 2px;
    font-size: 1rem; line-height: 1.85; margin-top: 2px;  /* 文章1行目とベースラインを揃える */
    color: var(--dial); border-bottom: 1px solid var(--line);
  }
  .row[data-type="dialogue"] .speaker:focus { border-bottom-color: var(--dial); }

  /* 地の文：原稿の慣例に合わせ字下げ */
  .row[data-type="narration"] textarea { text-indent: 1em; }
  /* 前提：本文ではないため字下げせず、識別色で区別する */
  .row[data-type="premise"] textarea { color: var(--prem); }
  /* セリフ：鉤括弧で囲み、一目で区別できるようにする */
  .row[data-type="dialogue"] .text { padding: 0 1.2em; }
  .row[data-type="dialogue"] .text::before,
  .row[data-type="dialogue"] .text::after {
    position: absolute; color: var(--dial); font-size: 1.125rem; line-height: 1.85; pointer-events: none;
  }
  .row[data-type="dialogue"] .text::before { content: "「"; left: 0; top: 4px; }
  .row[data-type="dialogue"] .text::after { content: "」"; right: 0; bottom: 4px; }

  /* ===== 下部固定操作バー（片手・寝姿勢で親指が届く位置） ===== */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr 1.4fr; gap: 8px; }
  .bar button { height: 50px; border-radius: 12px; font-size: 1rem; font-family: var(--sans); font-weight: 400; cursor: pointer; }
  #btn-clear { background: none; border: 1px solid var(--line); color: var(--muted); padding: 0 14px; }
  #btn-add { background: none; border: 1px solid var(--muted); color: var(--text); }
  /* 主操作は暗い琥珀の面で区別（明るい塗りは避ける） */
  #btn-copy { background: rgba(227, 183, 94, .16); border: 1px solid #8A6E3A; color: #E3B75E; font-weight: 500; }

  /* 操作結果通知：暗色の面＋枠線 */
  #toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 999px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>シーン下書き</h1>
    <span id="stat" aria-live="polite"></span>
  </header>

  <details id="prefix-box">
    <summary>前置き（コピー時に先頭へ付ける指示文）</summary>
    <label for="prefix" class="sr">前置き</label>
    <textarea id="prefix" placeholder="指示文を入力"></textarea>
  </details>

  <ol id="rows"></ol>
</main>

<div class="bar">
  <div class="bar-inner">
    <button id="btn-clear" type="button">消去</button>
    <button id="btn-add" type="button">＋ 行を追加</button>
    <button id="btn-copy" type="button">コピー</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ================= 設定 ================= */
const STORAGE_KEY = 'scene-draft-tool-v1'; // 自動保存に使うキー（既存データを引き継ぐため変更しない）
const STATE_VERSION = 2;                   // 保存データの形式バージョン（2：名前欄・前置き既定値に対応）
const INITIAL_ROWS = 5;                    // 初回表示時・消去後の行数
const SAVE_DELAY_MS = 400;                 // 入力停止から保存までの待機時間
const DEFAULT_PREFIX =                     // 前置きの既定値（公開コードのため汎用的な文にする）
  '以下の場面を小説として書いてください。';
const TYPE_LABELS = {                      // 種類ごとの表示・出力ラベル（キーの並びがボタンの並び順）
  premise: '前提',
  narration: '地の文',
  dialogue: 'セリフ',
};

/**
 * 1行分の出力形式を定義する。形式を変えたい場合はここだけ修正すればよい。
 * 前提　：【前提】文章（複数行なら空行を除き、各行に【前提】を付ける）
 * 地の文：【地の文】文章
 * セリフ：【セリフ】名前「文章」（名前は必須。空の場合はコピー前に止める）
 * @param {{type: string, name: string, text: string}} row - 前後空白除去済みの行データ
 * @returns {string}
 */
function formatLine(row) {
  if (row.type === 'premise') {
    // 貼り付けた複数行の各行にラベルを付け、ラベルの無い行が混ざらないようにする
    return row.text
      .split('\n')
      .map((lineText) => lineText.trim())
      .filter((lineText) => lineText !== '')
      .map((lineText) => `【${TYPE_LABELS.premise}】${lineText}`)
      .join('\n');
  }
  if (row.type !== 'dialogue') return `【${TYPE_LABELS.narration}】${row.text}`;
  // 利用者が自分で「」を打った場合に二重にならないよう、両端の鉤括弧を1つずつ除去
  const bareText = row.text.replace(/^「/, '').replace(/」$/, '');
  return `【${TYPE_LABELS.dialogue}】${row.name}「${bareText}」`;
}

/* ================= 要素参照 ================= */
const listEl = document.getElementById('rows');
const prefixEl = document.getElementById('prefix');
const prefixBoxEl = document.getElementById('prefix-box');
const statEl = document.getElementById('stat');
const toastEl = document.getElementById('toast');

/* ================= 状態 ================= */
let rowSeq = 0;              // ラジオボタンのname属性を行ごとに一意にするための連番
let saveTimer = null;        // 保存デバウンス用タイマー
let toastTimer = null;       // 通知の自動非表示用タイマー
let storageAvailable = true; // ストレージが使えない環境（プレビュー等）かどうか

/* ================= ユーティリティ ================= */

/**
 * テキストエリアの高さを内容に合わせて伸縮させる。
 * @param {HTMLTextAreaElement} areaEl
 */
function autoGrow(areaEl) {
  areaEl.style.height = 'auto';                     // 一度縮めて正しいscrollHeightを得る
  areaEl.style.height = `${areaEl.scrollHeight}px`;
}

/**
 * 画面下部に短い通知を表示する。
 * @param {string} message
 */
function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ================= 行の生成 ================= */

/**
 * 1行分のDOMを生成する。
 * @param {{type?: string, name?: string, text?: string}} data - 復元時の初期値
 * @returns {HTMLLIElement}
 */
function createRow(data = {}) {
  const type = Object.prototype.hasOwnProperty.call(TYPE_LABELS, data.type) ? data.type : 'narration'; // 未定義の種類は地の文扱い
  const groupName = `row-type-${rowSeq++}`;
  // 種類切替のボタンを TYPE_LABELS から生成（種類を増減してもここは修正不要）
  const toggleHtml = Object.entries(TYPE_LABELS)
    .map(([value, label]) => `<label><input type="radio" name="${groupName}" value="${value}"><span>${label}</span></label>`)
    .join('');

  const itemEl = document.createElement('li');
  itemEl.className = 'row';
  itemEl.dataset.type = type;

  itemEl.innerHTML = `
    <div class="row-head">
      <fieldset class="toggle">
        <legend>種類</legend>
        ${toggleHtml}
      </fieldset>
      <button type="button" class="del" aria-label="この行を削除">×</button>
    </div>
    <div class="body">
      <input type="text" class="speaker" aria-label="話者名" placeholder="名前" maxlength="20">
      <div class="text">
        <textarea rows="1" aria-label="文章" placeholder="文章を入力"></textarea>
      </div>
    </div>`;

  // 初期値はプロパティで反映（innerHTMLに埋め込むと入力文字列がHTMLとして解釈されるため）
  itemEl.querySelector(`input[value="${type}"]`).checked = true;
  itemEl.querySelector('.speaker').value = data.name || '';
  itemEl.querySelector('textarea').value = data.text || '';
  return itemEl;
}

/**
 * 行リストを指定データで描き直す。
 * @param {Array<{type: string, name: string, text: string}>} rowsData
 */
function renderRows(rowsData) {
  listEl.replaceChildren(...rowsData.map(createRow));
  // 描画確定後に高さ調整（直後だとscrollHeightが0になる場合がある）
  requestAnimationFrame(() => listEl.querySelectorAll('textarea').forEach(autoGrow));
  updateStat();
}

/** 空行を指定数ぶん作る */
const emptyRows = (count) => Array.from({ length: count }, () => ({ type: 'narration', name: '', text: '' }));

/* ================= 状態の取得・保存・復元 ================= */

/**
 * 現在の入力内容をオブジェクトとして取得する。
 * @returns {{version: number, prefix: string, rows: Array<{type: string, name: string, text: string}>}}
 */
function collectState() {
  return {
    version: STATE_VERSION,
    prefix: prefixEl.value,
    rows: [...listEl.children].map((itemEl) => ({
      type: itemEl.dataset.type,
      name: itemEl.querySelector('.speaker').value, // 地の文に切り替えても名前は保持（戻した時に復元される）
      text: itemEl.querySelector('textarea').value,
    })),
  };
}

/** 即時保存。ストレージ非対応環境では何もしない */
function saveNow() {
  clearTimeout(saveTimer);
  if (!storageAvailable) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
  } catch (error) {
    storageAvailable = false; // 容量超過・プライベートモード等
    updateStat();
  }
}

/** 入力のたびに書き込まないよう、一定時間後にまとめて保存 */
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, SAVE_DELAY_MS);
}

/**
 * 保存済みデータを読み込む。無い・壊れている場合はnull。
 * @returns {{version?: number, prefix: string, rows: Array}|null}
 */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed.rows) ? parsed : null;
  } catch (error) {
    storageAvailable = false;
    return null;
  }
}

/**
 * 起動時に表示する前置きを決める。
 * ・保存データなし → 既定値
 * ・旧形式（バージョン無し）で前置きが空 → 既定値（旧版には既定値が無かったため）
 * ・現行形式 → 保存値をそのまま使う（利用者が意図的に空にした場合も尊重）
 * @param {{version?: number, prefix?: string}|null} saved
 * @returns {string}
 */
function resolvePrefix(saved) {
  if (!saved) return DEFAULT_PREFIX;
  if (saved.version !== STATE_VERSION && !saved.prefix) return DEFAULT_PREFIX;
  return saved.prefix || '';
}

/* ================= 表示更新 ================= */

/** 入力済み行数と文字数を表示 */
function updateStat() {
  const filled = collectState().rows.filter((row) => row.text.trim() !== '');
  const chars = filled.reduce((sum, row) => sum + row.text.trim().length, 0);
  statEl.textContent = `${filled.length}行 / ${chars}字${storageAvailable ? '' : '（自動保存不可）'}`;
}

/* ================= 出力 ================= */

/**
 * 名前が未入力のセリフ行（文章は入力済み）のうち、最初の行の要素を返す。
 * 文章が空の行は出力されないため対象外。
 * @returns {HTMLLIElement|null}
 */
function findUnnamedDialogueRow() {
  return [...listEl.children].find((itemEl) =>
    itemEl.dataset.type === 'dialogue' &&
    itemEl.querySelector('textarea').value.trim() !== '' &&
    itemEl.querySelector('.speaker').value.trim() === ''
  ) || null;
}

/**
 * コピー用テキストを組み立てる。文章が空の行は除外。
 * 前提の行は、画面上の位置に関係なく先頭へまとめる（それ以外の行の順序は保つ）。
 * @returns {{text: string, count: number}}
 */
function buildOutput() {
  const state = collectState();
  const filledRows = state.rows.filter((row) => row.text.trim() !== '');
  const orderedRows = [
    ...filledRows.filter((row) => row.type === 'premise'),
    ...filledRows.filter((row) => row.type !== 'premise'),
  ];
  const lines = orderedRows
    .map((row) => formatLine({ type: row.type, name: row.name.trim(), text: row.text.trim() }));

  const parts = [];
  if (state.prefix.trim() !== '' && lines.length > 0) parts.push(state.prefix.trim(), ''); // 前置きと本文の間に空行
  parts.push(...lines);
  return { text: parts.join('\n'), count: lines.length };
}

/**
 * クリップボードへ書き込む。
 * Clipboard APIはHTTPS等の安全な環境でのみ動くため、失敗時は旧方式で再試行する。
 * @param {string} text
 * @returns {Promise<boolean>} 成否
 */
async function writeClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (error) {
    const tempEl = document.createElement('textarea');
    tempEl.value = text;
    tempEl.setAttribute('readonly', '');
    tempEl.style.position = 'fixed';
    tempEl.style.opacity = '0';
    document.body.appendChild(tempEl);
    tempEl.select();
    const succeeded = document.execCommand('copy');
    tempEl.remove();
    return succeeded;
  }
}

/* ================= イベント ================= */

// 行内の操作はリスト全体で一括処理（行の増減に追従するため）
listEl.addEventListener('input', (event) => {
  if (event.target.tagName === 'TEXTAREA') {
    autoGrow(event.target);
    updateStat();
    scheduleSave();
  } else if (event.target.classList.contains('speaker')) {
    scheduleSave();
  }
});

listEl.addEventListener('change', (event) => {
  if (event.target.type !== 'radio') return;
  const itemEl = event.target.closest('.row');
  itemEl.dataset.type = event.target.value; // 見た目（字下げ／名前欄・鉤括弧）を切替
  // 名前欄の表示で文章欄の幅が変わり折返しが変化するため、描画後に高さを再計算
  requestAnimationFrame(() => autoGrow(itemEl.querySelector('textarea')));
  scheduleSave();
});

listEl.addEventListener('click', (event) => {
  const deleteBtn = event.target.closest('.del');
  if (!deleteBtn) return;
  const itemEl = deleteBtn.closest('.row');
  const areaEl = itemEl.querySelector('textarea');
  const nameEl = itemEl.querySelector('.speaker');

  // 何か入力されている行は誤タップ対策で確認
  const hasContent = areaEl.value.trim() !== '' || nameEl.value.trim() !== '';
  if (hasContent && !confirm('この行を削除しますか？')) return;

  if (listEl.children.length === 1) {
    areaEl.value = ''; // 最後の1行は削除せず中身だけ空にする
    nameEl.value = '';
    autoGrow(areaEl);
  } else {
    itemEl.remove();
  }
  updateStat();
  saveNow();
});

prefixEl.addEventListener('input', () => {
  autoGrow(prefixEl);
  scheduleSave();
});
// 折りたたみを開いた時点で高さを合わせる（閉じている間は高さ0で計算できないため）
prefixBoxEl.addEventListener('toggle', () => autoGrow(prefixEl));

document.getElementById('btn-add').addEventListener('click', () => {
  const itemEl = createRow();
  listEl.appendChild(itemEl);
  itemEl.querySelector('textarea').focus();
  itemEl.scrollIntoView({ block: 'center' });
  saveNow();
});

document.getElementById('btn-copy').addEventListener('click', async () => {
  const output = buildOutput();
  if (output.count === 0) {
    showToast('コピーする文章がありません');
    return;
  }
  // 話者名は必須。未入力の行があればコピーせず、その名前欄へ移動する
  const unnamedRowEl = findUnnamedDialogueRow();
  if (unnamedRowEl) {
    unnamedRowEl.scrollIntoView({ block: 'center' });
    unnamedRowEl.querySelector('.speaker').focus();
    showToast('名前が未入力のセリフがあります');
    return;
  }
  const succeeded = await writeClipboard(output.text);
  showToast(succeeded ? `${output.count}行をコピーしました` : 'コピーできませんでした');
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('すべての行を消去しますか？（前置きは残ります）')) return;
  renderRows(emptyRows(INITIAL_ROWS));
  saveNow();
  window.scrollTo({ top: 0 });
});

// タブ切替・アプリ切替時に取りこぼしなく保存
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});

/* ================= 初期化 ================= */
(function init() {
  const saved = loadState();
  prefixEl.value = resolvePrefix(saved);
  renderRows(saved && saved.rows.length > 0 ? saved.rows : emptyRows(INITIAL_ROWS));
  saveNow(); // 旧形式データを現行形式で保存し直す（既定値の再適用を防ぐ）
})();
</script>
</body>
</html>
